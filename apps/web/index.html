<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mandate — INVRT research workbench</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>M</text></svg>" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark">M</span>
        <div>
          <strong>Mandate</strong>
          <small>INVRT research workbench</small>
        </div>
      </div>
      <div class="topbar-right">
        <span id="mode-badge" class="badge" title="How answers are produced"></span>
        <div id="user-area"></div>
      </div>
    </header>

    <main id="app" class="app"></main>

    <aside id="drawer" class="drawer" hidden>
      <div class="drawer-head">
        <strong id="drawer-title">Source</strong>
        <button class="icon-btn" id="drawer-close" aria-label="Close source panel">&times;</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
